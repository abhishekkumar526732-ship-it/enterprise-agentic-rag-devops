apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-copilot-ingress
  namespace: enterprise-hr
  annotations:
    # AWS Load Balancer Controller Annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Replace with your AWS Certificate Manager (ACM) ARN:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/abc-123
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  ingressClassName: alb
  rules:
    - host: hr-copilot.yourdomain.com  # Replace with your company domain or omit for default ALB DNS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-copilot-service
                port:
                  number: 80
